<svg xmlns="http://www.w3.org/2000/svg" width="960" height="254" viewBox="0 0 960 254" role="img" aria-labelledby="title desc"><title id="title">Three engineering evidence snapshots</title><desc id="desc">Historical T4 GEMM: 1.28 TFLOPS, 24% of cuBLAS, kernel time only. PolicyLens: 24 of 31 pass, 0 of 3 partial-evidence cases pass, synthetic corpus without held-out calibration. Java Order Book: 60,000 generated commands, 40 fixed seeds, finite regression coverage.</desc><rect x="0" y="0" width="960" height="254" fill="#15171c" /><path d="M326 26L326 228" stroke="#34363b"/><path d="M645 26L645 228" stroke="#34363b"/><text x="28" y="34" font-family="monospace" font-size="12" fill="#d9bc88" >GPU COMPUTING</text><text x="28" y="76" font-family="Georgia, Times New Roman, serif" font-size="32" fill="#f3eee4" >1.28 TFLOPS</text><text x="28" y="103" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b8b3a9" >FP32 GEMM · Tesla T4 · 1024²</text><text x="28" y="133" font-family="monospace" font-size="12" fill="#b8b3a9" >Naive</text><rect x="104" y="123" width="13.766101961759787" height="12" fill="#34363b" /><text x="28" y="157" font-family="monospace" font-size="12" fill="#b8b3a9" >Custom</text><rect x="104" y="147" width="45.637657882124586" height="12" fill="#d9bc88" /><text x="28" y="181" font-family="monospace" font-size="12" fill="#b8b3a9" >cuBLAS</text><rect x="104" y="171" width="190.0" height="12" fill="#34363b" /><text x="28" y="211" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b8b3a9" >24% of cuBLAS · kernel time only</text><text x="346" y="34" font-family="monospace" font-size="12" fill="#d9bc88" >AI EVALUATION</text><text x="346" y="76" font-family="Georgia, Times New Roman, serif" font-size="32" fill="#f3eee4" >24 / 31 passed</text><text x="346" y="103" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#b8b3a9" >PolicyLens · recorded evaluation</text><rect x="346" y="122" width="11" height="14" fill="#d9bc88" stroke