<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="t d"><title id="t">Sourced — product flow and who built which part</title><desc id="d">Sourced flow from its README: source-linked search and a user-confirmed Passport feed a review of criteria and unknowns; compare and plan leads to My Journey (browser storage) and a Supabase-backed Tracker. I built search, comparison, My Journey, Opportunity Brief and affordability-scenario UI; teammates owned CV extraction, retrieval and eligibility verification. Unknown stays unknown.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#9db7f5" stop-opacity="0.2"/><stop offset="1" stop-color="#9db7f5" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="959.0" height="235.0" rx="14" fill="#15171c" stroke="#34363b" stroke-width="1"/><rect x="0.5" y="0.5" width="959.0" height="235.0" rx="14" fill="url(#g)"/><rect x="28.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#9db7f5"/><text x="28" y="44" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#9db7f5" letter-spacing="1.6">06 — TEAM PRODUCT</text><text x="28" y="92" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="34" fill="#f3eee4" font-weight="700">Sourced</text><text x="28" y="118" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#b8b3a9" >BUILD ACROSS Hackathon, Hong Kong.</text><text x="28" y="168" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="22" fill="#f3eee4" font-style="italic">Unknown stays unknown.</text><text x="28" y="192" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#b8b3a9" >Missing eligibility criteria are never</text><text x="28" y="210" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#b8b3a9" >treated as satisfied.</text><rect x="538.0" y="40.0" width="118.0" height="46.0" rx="9" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="597.0" y="60" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#f3eee4" text-anchor="middle" font-weight="700">Passport</text><text x="597.0" y="76" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#b8b3a9" text-anchor="middle" data-keep="1">user-confirmed</text><text x="597.0" y="100" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#9db7f5" text-anchor="middle">↓</text><rect x="400.0" y="108.0" width="118.0" height="46.0" rx="9" fill="#9db7f5"/><text x="459.0" y="128" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#15171c" text-anchor="middle" font-weight="700">Search</text><text x="459.0" y="144" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#15171c" text-anchor="middle" data-keep="1">source-linked</text><text x="528.0" y="136" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#9db7f5" text-anchor="middle">→</text><rect x="538.0" y="108.0" width="118.0" height="46.0" rx="9" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="597.0" y="128" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#f3eee4" text-anchor="middle" font-weight="700">Review</text><text x="597.0" y="144" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#b8b3a9" text-anchor="middle" data-keep="1">unknown ≠ met</text><text x="666.0" y="136" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#9db7f5" text-anchor="middle">→</text><rect x="676.0" y="108.0" width="118.0" height="46.0" rx="9" fill="#9db7f5"/><text x="735.0" y="128" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#15171c" text-anchor="middle" font-weight="700">Compare</text><text x="735.0" y="144" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#15171c" text-anchor="middle" data-keep="1">and plan</text><text x="804.0" y="123" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#9db7f5" text-anchor="middle">→</text><rect x="814.0" y="84.0" width="118.0" height="46.0" rx="9" fill="#9db7f5"/><text x="873.0" y="104" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#15171c" text-anchor="middle" font-weight="700">My Journey</text><text x="873.0" y="120" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#15171c" text-anchor="middle" data-keep="1">browser-local</text><text x="804.0" y="160" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#9db7f5" text-anchor="middle">→</text><rect x="814.0" y="138.0" width="118.0" height="46.0" rx="9" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="873.0" y="158" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#f3eee4" text-anchor="middle" font-weight="700">Tracker</text><text x="873.0" y="174" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="10.5" fill="#b8b3a9" text-anchor="middle" data-keep="1">Supabase</text><rect x="400.0" y="208.0" width="12.0" height="12.0" rx="3" fill="#9db7f5"/><text x="420" y="218" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" fill="#f3eee4" >UI I built</text><rect x="500.0" y="208.0" width="12.0" height="12.0" rx="3" fill="none" stroke="#b8b3a9" stroke-width="1"/><text x="520" y="218" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" fill="#f3eee4" >teammates’ or shared</text></svg>
