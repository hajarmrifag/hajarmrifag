<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="t d"><title id="t">ViewShift Lab — synthetic viewpoint-reasoning study</title><desc id="d">Recorded mean OOD accuracy across four training seeds on fixed synthetic scenes: 48.1 percent single-view CNN and 57.8 percent two-view CNN. Matched parameter counts, extra two-view input and compute. Zero to 100 percent bars. Real-photo validation pending.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#56528c" stop-opacity="0.2"/><stop offset="1" stop-color="#56528c" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="959.0" height="279.0" rx="14" fill="#f4f0e7" stroke="#d6cfc2" stroke-width="1"/><rect x="0.5" y="0.5" width="959.0" height="279.0" rx="14" fill="url(#g)"/><rect x="28.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#56528c"/><text x="28" y="38" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#56528c" letter-spacing="1.6">INDEPENDENT AI RESEARCH</text><text x="28" y="90" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="38" fill="#24262b" font-weight="700">ViewShift Lab</text><text x="28" y="127" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="23" fill="#24262b" >When does a second</text><text x="28" y="158" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="23" fill="#24262b" font-style="italic">view help?</text><text x="28" y="209" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Matched parameters. Paired predictions.</text><text x="28" y="232" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Same synthetic scenes; four training seeds.</text><text x="444" y="68" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#24262b" >Single-view CNN</text><text x="932" y="68" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="18" fill="#62615d" text-anchor="end">48.1%</text><rect x="444.0" y="80.0" width="488.0" height="12.0" rx="3" fill="#d6cfc2"/><rect x="444.0" y="80.0" width="234.7" height="12.0" rx="3" fill="#62615d"/><text x="444" y="134" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#24262b" >Two-view CNN</text><text x="932" y="134" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="18" fill="#56528c" text-anchor="end">57.8%</text><rect x="444.0" y="146.0" width="488.0" height="12.0" rx="3" fill="#d6cfc2"/><rect x="444.0" y="146.0" width="282.1" height="12.0" rx="3" fill="#56528c"/><text x="444" y="209" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#62615d" >Held-out camera-angle accuracy · 0–100% bars</text><text x="444" y="233" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#62615d" >Synthetic disks; extra compute. Real-photo validation pending.</text></svg>
