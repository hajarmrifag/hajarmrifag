<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="t d"><title id="t">WebAtlas — durable observations and crash recovery</title><desc id="d">Architecture schematic: PostgreSQL lease, bounded processing, transactional persistence and acknowledgement. Recorded synthetic SIGKILL test recovered 64 leases and completed 300 of 300 jobs. At-least-once execution, not exactly once.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#476334" stop-opacity="0.2"/><stop offset="1" stop-color="#476334" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="959.0" height="289.0" rx="14" fill="#f4f0e7" stroke="#d6cfc2" stroke-width="1"/><rect x="0.5" y="0.5" width="959.0" height="289.0" rx="14" fill="url(#g)"/><rect x="28.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#476334"/><text x="28" y="38" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#476334" letter-spacing="1.6">DATA &amp; DISTRIBUTED SYSTEMS</text><text x="28" y="91" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="39" fill="#24262b" font-weight="700">WebAtlas</text><text x="28" y="126" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="22" fill="#24262b" >The worker stops.</text><text x="28" y="155" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="22" fill="#24262b" font-style="italic">The work survives.</text><text x="28" y="204" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" fill="#476334" font-weight="700">64 leases reclaimed · 300/300 jobs</text><text x="28" y="230" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Recorded synthetic crash-recovery test.</text><rect x="420.0" y="75.0" width="156.0" height="86.0" rx="7" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1"/><text x="498" y="111" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="21" fill="#24262b" text-anchor="middle">Claim</text><text x="498" y="139" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#62615d" text-anchor="middle">expiring lease</text><text x="585" y="124" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" fill="#476334" text-anchor="middle">→</text><rect x="594.0" y="75.0" width="156.0" height="86.0" rx="7" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1"/><text x="672" y="111" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="21" fill="#24262b" text-anchor="middle">Process</text><text x="672" y="139" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#62615d" text-anchor="middle">bounded workers</text><text x="759" y="124" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" fill="#476334" text-anchor="middle">→</text><rect x="768.0" y="75.0" width="156.0" height="86.0" rx="7" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1"/><text x="846" y="111" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="21" fill="#24262b" text-anchor="middle">Commit</text><text x="846" y="139" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11" fill="#62615d" text-anchor="middle">history + ack</text><text x="420" y="206" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="17" fill="#24262b" >At-least-once execution.</text><text x="420" y="232" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Idempotent committed effects; not exactly once.</text></svg>
