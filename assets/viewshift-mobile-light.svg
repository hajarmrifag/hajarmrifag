<svg xmlns="http://www.w3.org/2000/svg" width="400" height="370" viewBox="0 0 400 370" role="img" aria-labelledby="t d"><title id="t">ViewShift Lab — synthetic viewpoint-reasoning study</title><desc id="d">Recorded mean OOD accuracy across four training seeds on fixed synthetic scenes: 48.1 percent single-view CNN and 57.8 percent two-view CNN. Matched parameter counts, extra two-view input and compute. Zero to 100 percent bars. Real-photo validation pending.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#56528c" stop-opacity="0.2"/><stop offset="1" stop-color="#56528c" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="399.0" height="369.0" rx="14" fill="#f4f0e7" stroke="#d6cfc2" stroke-width="1"/><rect x="0.5" y="0.5" width="399.0" height="369.0" rx="14" fill="url(#g)"/><rect x="16.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#56528c"/><text x="16" y="30" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#56528c" letter-spacing="1.6">INDEPENDENT AI RESEARCH</text><text x="16" y="74" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="32" fill="#24262b" font-weight="700">ViewShift Lab</text><text x="16" y="105" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" fill="#62615d" >When does a second view help?</text><text x="16" y="145" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#24262b" >Single-view CNN</text><text x="384" y="145" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="18" fill="#62615d" text-anchor="end">48.1%</text><rect x="16.0" y="157.0" width="368.0" height="12.0" rx="3" fill="#d6cfc2"/><rect x="16.0" y="157.0" width="177.0" height="12.0" rx="3" fill="#62615d"/><text x="16" y="211" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#24262b" >Two-view CNN</text><text x="384" y="211" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="18" fill="#56528c" text-anchor="end">57.8%</text><rect x="16.0" y="223.0" width="368.0" height="12.0" rx="3" fill="#d6cfc2"/><rect x="16.0" y="223.0" width="212.7" height="12.0" rx="3" fill="#56528c"/><text x="16" y="295" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Held-out camera-angle accuracy · 0–100% bars</text><text x="16" y="320" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >Synthetic projected disks; extra two-view compute.</text><text x="16" y="345" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#56528c" >Real-photo validation pending.</text></svg>
