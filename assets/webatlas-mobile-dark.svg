<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430" role="img" aria-labelledby="t d"><title id="t">WebAtlas — durable observations and crash recovery</title><desc id="d">Architecture schematic: PostgreSQL lease, bounded processing, transactional persistence and acknowledgement. Recorded synthetic SIGKILL test recovered 64 leases and completed 300 of 300 jobs. At-least-once execution, not exactly once.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#b2ce9a" stop-opacity="0.2"/><stop offset="1" stop-color="#b2ce9a" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="399.0" height="429.0" rx="14" fill="#15171c" stroke="#34363b" stroke-width="1"/><rect x="0.5" y="0.5" width="399.0" height="429.0" rx="14" fill="url(#g)"/><rect x="16.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#b2ce9a"/><text x="16" y="30" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#b2ce9a" letter-spacing="1.6">DATA &amp; DISTRIBUTED SYSTEMS</text><text x="16" y="76" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="34" fill="#f3eee4" font-weight="700">WebAtlas</text><text x="16" y="105" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="16" fill="#b8b3a9" >The worker stops. The work survives.</text><rect x="16.0" y="140.0" width="368.0" height="48.0" rx="5" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="30" y="160" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#f3eee4" >Claim a lease</text><text x="30" y="179" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#b8b3a9" >PostgreSQL · SKIP LOCKED</text><rect x="16.0" y="202.0" width="368.0" height="48.0" rx="5" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="30" y="222" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#f3eee4" >Process an observation</text><text x="30" y="241" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#b8b3a9" >Bounded workers · provenance</text><rect x="16.0" y="264.0" width="368.0" height="48.0" rx="5" fill="#1d2026" stroke="#34363b" stroke-width="1"/><text x="30" y="284" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#f3eee4" >Commit and acknowledge</text><text x="30" y="303" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#b8b3a9" >Observation + history + job</text><text x="16" y="362" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="17" fill="#b2ce9a" font-weight="700">64 leases reclaimed · 300/300 jobs</text><text x="16" y="389" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#b8b3a9" >Recorded synthetic crash test; at-least-once</text><text x="16" y="410" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#b8b3a9" >execution with idempotent committed effects.</text></svg>
