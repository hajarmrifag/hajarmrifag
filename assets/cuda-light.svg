<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">CUDA GEMM on a T4 — naive, custom and cuBLAS</title><desc id="d">Tesla T4, FP32 GEMM at 1024 by 1024, kernel time only. Naive 385.648, custom 1278.508 and cuBLAS 5322.721 GFLOP/s. Custom reaches 1.28 TFLOPS, 3.32 times naive and 24 percent of cuBLAS. Linear bars with zero origin; historical results.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#4a7800" stop-opacity="0.2"/><stop offset="1" stop-color="#4a7800" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="959.0" height="299.0" rx="14" fill="#f4f0e7" stroke="#d6cfc2" stroke-width="1"/><rect x="0.5" y="0.5" width="959.0" height="299.0" rx="14" fill="url(#g)"/><rect x="28.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#4a7800"/><text x="28" y="44" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#4a7800" letter-spacing="1.6">03 — CUDA TRANSFORMER KERNELS</text><text x="28" y="96" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="34" fill="#24262b" font-weight="700">From memory access</text><text x="28" y="136" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="34" fill="#24262b" font-weight="700">to measurement.</text><text x="28" y="176" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#62615d" >Custom GEMM against naive and cuBLAS.</text><text x="28" y="202" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#62615d" letter-spacing="1.6">T4 · FP32 · 1024 × 1024 · KERNEL TIME</text><text x="28" y="250" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#24262b" >cuBLAS stays in view as the stronger reference.</text><text x="440" y="78" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#62615d" font-weight="400">Naive</text><rect x="520.0" y="62.0" width="320.0" height="22.0" rx="4" fill="#d6cfc299"/><rect x="520.0" y="62.0" width="23.2" height="22.0" rx="4" fill="#62615d"/><text x="932" y="79" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="15" fill="#24262b" text-anchor="end">386</text><text x="440" y="136" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#24262b" font-weight="700">Custom</text><rect x="520.0" y="120.0" width="320.0" height="22.0" rx="4" fill="#d6cfc299"/><rect x="520.0" y="120.0" width="76.9" height="22.0" rx="4" fill="#4a7800"/><text x="932" y="137" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="15" fill="#24262b" text-anchor="end">1,279</text><text x="440" y="194" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#62615d" font-weight="400">cuBLAS</text><rect x="520.0" y="178.0" width="320.0" height="22.0" rx="4" fill="#d6cfc299"/><rect x="520.0" y="178.0" width="320.0" height="22.0" rx="4" fill="#796038"/><text x="932" y="195" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="15" fill="#24262b" text-anchor="end">5,323</text><rect x="440.0" y="236.0" width="492.0" height="1.0" rx="0" fill="#d6cfc2"/><text x="440" y="266" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="18" fill="#4a7800" font-weight="700">1.28 TFLOPS</text><text x="572" y="266" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#24262b" >· 3.32× naive · 24% of cuBLAS</text><text x="932" y="288" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" fill="#62615d" text-anchor="end">GFLOP/s · linear bars from zero</text></svg>
