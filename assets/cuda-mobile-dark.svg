<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-labelledby="t d"><title id="t">CUDA GEMM on a T4 — naive, custom and cuBLAS</title><desc id="d">Tesla T4, FP32 GEMM at 1024 by 1024, kernel time only. Naive 385.648, custom 1278.508 and cuBLAS 5322.721 GFLOP/s. Custom reaches 1.28 TFLOPS, 3.32 times naive and 24 percent of cuBLAS. Linear bars with zero origin; historical results.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#9bd13a" stop-opacity="0.2"/><stop offset="1" stop-color="#9bd13a" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="399.0" height="329.0" rx="14" fill="#15171c" stroke="#34363b" stroke-width="1"/><rect x="0.5" y="0.5" width="399.0" height="329.0" rx="14" fill="url(#g)"/><rect x="16.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#9bd13a"/><text x="16" y="28" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#9bd13a" letter-spacing="1.6">03 — CUDA TRANSFORMER KERNELS</text><text x="16" y="66" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="26" fill="#f3eee4" font-weight="700">From memory access</text><text x="16" y="96" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="26" fill="#f3eee4" font-weight="700">to measurement.</text><text x="16" y="122" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#b8b3a9" letter-spacing="1.6">T4 · FP32 GEMM · 1024² · KERNEL TIME</text><text x="16" y="148" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#b8b3a9" font-weight="400">Naive</text><text x="384" y="148" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="14" fill="#f3eee4" text-anchor="end">386</text><rect x="16.0" y="156.0" width="368.0" height="14.0" rx="3" fill="#34363b99"/><rect x="16.0" y="156.0" width="26.7" height="14.0" rx="3" fill="#b8b3a9"/><text x="16" y="194" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#f3eee4" font-weight="700">Custom</text><text x="384" y="194" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="14" fill="#f3eee4" text-anchor="end">1,279</text><rect x="16.0" y="202.0" width="368.0" height="14.0" rx="3" fill="#34363b99"/><rect x="16.0" y="202.0" width="88.4" height="14.0" rx="3" fill="#9bd13a"/><text x="16" y="240" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#b8b3a9" font-weight="400">cuBLAS</text><text x="384" y="240" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="14" fill="#f3eee4" text-anchor="end">5,323</text><rect x="16.0" y="248.0" width="368.0" height="14.0" rx="3" fill="#34363b99"/><rect x="16.0" y="248.0" width="368.0" height="14.0" rx="3" fill="#d9bc88"/><text x="16" y="312" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#9bd13a" font-weight="700">1.28 TFLOPS · 3.32× naive · 24% of cuBLAS</text></svg>
