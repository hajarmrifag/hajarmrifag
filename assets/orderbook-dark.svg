<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-labelledby="t d"><title id="t">Java Order Book — 40 seeds of 1,500 commands, 60,000 in total</title><desc id="d">Forty seeds, each of 1,500 generated commands, are checked against an independent list-based reference model: 60,000 commands in a finite regression set. Integer ticks, FIFO price levels, single writer; JMH measures batches and allocations.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#e0a86b" stop-opacity="0.2"/><stop offset="1" stop-color="#e0a86b" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="959.0" height="229.0" rx="14" fill="#15171c" stroke="#34363b" stroke-width="1"/><rect x="0.5" y="0.5" width="959.0" height="229.0" rx="14" fill="url(#g)"/><rect x="28.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#e0a86b"/><text x="28" y="44" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#e0a86b" letter-spacing="1.6">05 — JAVA ORDER BOOK</text><text x="28" y="92" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="32" fill="#f3eee4" font-weight="700">Correctness</text><text x="28" y="128" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="32" fill="#f3eee4" font-weight="700">before throughput.</text><rect x="28.0" y="152.0" width="112.5" height="26.0" rx="13" fill="none" stroke="#34363b" stroke-width="1"/><text x="84.24" y="169.5" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#f3eee4" text-anchor="middle">integer ticks</text><rect x="148.5" y="152.0" width="140.3" height="26.0" rx="13" fill="none" stroke="#34363b" stroke-width="1"/><text x="218.64" y="169.5" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#f3eee4" text-anchor="middle">FIFO price levels</text><rect x="296.8" y="152.0" width="112.5" height="26.0" rx="13" fill="none" stroke="#34363b" stroke-width="1"/><text x="353.03999999999996" y="169.5" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#f3eee4" text-anchor="middle">single writer</text><text x="28" y="214" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#b8b3a9" >JMH measures batches and allocations.</text><text x="452" y="44" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#b8b3a9" letter-spacing="1.6">60,000 GENERATED COMMANDS</text><rect x="452.0" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="476.2" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="500.5" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="524.8" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="549.0" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="573.2" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="597.5" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="621.8" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="646.0" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="670.2" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="694.5" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="718.8" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="743.0" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="767.2" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="791.5" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="815.8" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="840.0" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="864.2" y="62.0" width="19.2" height="26.0" rx="3" fill="#e0a86b"/><rect x="888.5" y="62.0" width="19.2" height="26.0" rx="3" fill=