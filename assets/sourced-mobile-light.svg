<svg xmlns="http://www.w3.org/2000/svg" width="400" height="372" viewBox="0 0 400 372" role="img" aria-labelledby="t d"><title id="t">Sourced — product flow and who built which part</title><desc id="d">Sourced flow from its README: source-linked search and a user-confirmed Passport feed a review of criteria and unknowns; compare and plan leads to My Journey (browser storage) and a Supabase-backed Tracker. I built search, comparison, My Journey, Opportunity Brief and affordability-scenario UI; teammates owned CV extraction, retrieval and eligibility verification. Unknown stays unknown.</desc><defs><radialGradient id="g" cx="90%" cy="0%" r="75%"><stop offset="0" stop-color="#3a58ae" stop-opacity="0.2"/><stop offset="1" stop-color="#3a58ae" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="399.0" height="371.0" rx="14" fill="#f4f0e7" stroke="#d6cfc2" stroke-width="1"/><rect x="0.5" y="0.5" width="399.0" height="371.0" rx="14" fill="url(#g)"/><rect x="16.0" y="0.5" width="56.0" height="3.0" rx="1.5" fill="#3a58ae"/><text x="16" y="28" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#3a58ae" letter-spacing="1.6">06 — TEAM PRODUCT</text><text x="16" y="64" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="28" fill="#24262b" font-weight="700">Sourced</text><text x="16" y="88" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#62615d" >BUILD ACROSS Hackathon, Hong Kong</text><text x="16" y="128" font-family='"Iowan Old Style", "Palatino Linotype", Georgia, serif' font-size="21" fill="#24262b" font-style="italic">Unknown stays unknown.</text><rect x="16.0" y="150.0" width="112.0" height="46.0" rx="9" fill="#3a58ae"/><text x="72.0" y="170" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#f4f0e7" text-anchor="middle" font-weight="700">Search</text><text x="72.0" y="186" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#f4f0e7" text-anchor="middle" data-keep="1">source-linked</text><text x="136.0" y="178" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#3a58ae" text-anchor="middle">→</text><rect x="144.0" y="150.0" width="112.0" height="46.0" rx="9" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1"/><text x="200.0" y="170" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#24262b" text-anchor="middle" font-weight="700">Review</text><text x="200.0" y="186" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#62615d" text-anchor="middle" data-keep="1">unknown ≠ met</text><text x="264.0" y="178" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#3a58ae" text-anchor="middle">←</text><rect x="272.0" y="150.0" width="112.0" height="46.0" rx="9" fill="#fbf9f3" stroke="#d6cfc2" stroke-width="1"/><text x="328.0" y="170" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#24262b" text-anchor="middle" font-weight="700">Passport</text><text x="328.0" y="186" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#62615d" text-anchor="middle" data-keep="1">user-confirmed</text><text x="200.0" y="212" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#3a58ae" text-anchor="middle">↓</text><rect x="144.0" y="218.0" width="112.0" height="46.0" rx="9" fill="#3a58ae"/><text x="200.0" y="238" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#f4f0e7" text-anchor="middle" font-weight="700">Compare</text><text x="200.0" y="254" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12" fill="#f4f0e7" text-anchor="middle" data-keep="1">and plan</text><rect x="16.0" y="218.0" width="112.0" height="46.