<svg xmlns="http://www.w3.org/2000/svg" width="400" height="458" viewBox="0 0 400 458" role="img" aria-labelledby="title desc"><title id="title">Engineering evidence snapshots</title><desc id="desc">Recorded CUDA throughput, synthetic PolicyLens evaluation, and finite Java reference-model regression checks. Full context appears in the project descriptions.</desc><rect x="0" y="0" width="400" height="458" fill="#15171c" /><text x="24" y="28" font-family="monospace" font-size="14" fill="#d9bc88" >GPU COMPUTING</text><text x="24" y="71" font-family="Georgia, Times New Roman, serif" font-size="34" fill="#f3eee4" >1.28 TFLOPS</text><text x="24" y="104" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f3eee4" >T4 · FP32 GEMM · 1024 × 1024</text><text x="24" y="131" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b8b3a9" >24% of cuBLAS · kernel time only</text><path d="M24 152L376 152" stroke="#34363b"/><text x="24" y="180" font-family="monospace" font-size="14" fill="#d9bc88" >AI EVALUATION</text><text x="24" y="223" font-family="Georgia, Times New Roman, serif" font-size="34" fill="#f3eee4" >24 / 31 passed</text><text x="24" y="256" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f3eee4" >PolicyLens · 0/3 partial evidence</text><text x="24" y="283" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b8b3a9" >Synthetic corpus · not held out</text><path d="M24 304L376 304" stroke="#34363b"/><text x="24" y="332" font-family="monospace" font-size="14" fill="#d9bc88" >ALGORITHMS</text><text x="24" y="375" font-family="Georgia, Times New Roman, serif" font-size="34" fill="#f3eee4" >60,000 commands</text><text x="24" y="408" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#f3eee4" >Java Order Book · reference checks</text><text x="24" y="435" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b8b3a9" >40 seeds × 1,500 commands</text></svg>
